l_spanish:
 elven_imperialism: "Imperialismo élfico"
 elven_imperialism_desc: "El imperialismo élfico sostiene que el emperador preserva un orden eterno en el que solo los elfos están destinados a gobernar. Los demás pueblos quedan excluidos del poder político, mientras una casta servil hereditaria es tratada como propiedad del Estado."
 SHA_elven_imperialism: "Imperio Rohendel"
 SHA_elven_imperialism_DEF: "el Imperio Rohendel"
 SHA_elven_imperialism_ADJ: "Rohendel"
 SHA_neutrality_party: "Corte Imperial"
 SHA_neutrality_party_long: "Corte Imperial Rohendel"
 SHA_eternal_emperor: "Dios Emperador"
 SHA_eternal_emperor_desc: "Tarkan Rohendel, el mago elfo vivo más antiguo, ha gobernado el Imperio durante sus 3717 años de existencia. Su cuerpo quebrado subsiste en un trono que lo mantiene con vida, mientras su voluntad posee vasos para actuar en el mundo."
