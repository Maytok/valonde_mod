l_spanish:
 elven_imperialism: "Imperialismo élfico"
 elven_imperialism_desc: "El imperialismo élfico sostiene que el emperador preserva un orden eterno en el que solo los elfos están destinados a gobernar. Los demás pueblos quedan excluidos del poder político, mientras una casta servil hereditaria es tratada como propiedad del Estado."
